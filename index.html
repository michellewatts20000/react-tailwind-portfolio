  <!-- Google tag (gtag.js) -->
<!-- Loaded on the visitor's first interaction (or after 5 seconds) so it doesn't compete with the
     site while it starts up. gtag() calls before then are queued in dataLayer and sent once the
     script arrives. Visitors who leave within 5 seconds without interacting won't be counted. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Z5SWHFG9S1');

  (function () {
    var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
    var loaded = false;
    var timer;
    var loadGtag = function () {
      if (loaded) return;
      loaded = true;
      clearTimeout(timer);
      events.forEach(function (event) { window.removeEventListener(event, loadGtag); });
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-Z5SWHFG9S1';
      document.head.appendChild(script);
    };
    events.forEach(function (event) { window.addEventListener(event, loadGtag, { once: true, passive: true }); });
    timer = setTimeout(loadGtag, 5000);
  })();
</script>
